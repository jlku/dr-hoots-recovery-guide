<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#030b18">
  <title>Recovery safety cards — digital guide</title>
  <style>
    :root {
      --shell: #030b18;
      --shell-soft: #0a1627;
      --ink: #071b43;
      --ink-soft: #1c385c;
      --paper: #fbfaf5;
      --paper-edge: #d8dedf;
      --teal: #07988e;
      --teal-pale: #dcefeb;
      --warning: #9c2f2a;
      --muted: #9eb0c2;
      --active-index: 0;
      --progress: 7.142857%;
      color-scheme: dark;
    }

    * { box-sizing: border-box; }

    html {
      background: var(--shell);
      scroll-behavior: smooth;
      scrollbar-color: #53667b var(--shell);
    }

    body {
      margin: 0;
      min-width: 320px;
      color: #edf3f7;
      font-family: "Avenir Next", Avenir, "Century Gothic", sans-serif;
      background:
        radial-gradient(circle at 50% 14%, rgba(35, 66, 100, .24), transparent 35rem),
        var(--shell);
    }

    button, a { font: inherit; }

    .topbar {
      position: fixed;
      inset: 0 0 auto;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 68px;
      padding: 11px clamp(14px, 2.3vw, 34px);
      border-bottom: 1px solid rgba(213, 224, 234, .17);
      background: rgba(3, 11, 24, .96);
    }

    .brand {
      min-width: 0;
      line-height: 1.05;
    }

    .brand h1 {
      display: block;
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(17px, 1.55vw, 25px);
      font-weight: 700;
      letter-spacing: -.025em;
    }

    .brand p {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    .modes {
      display: flex;
      flex: none;
      gap: 3px;
      padding: 3px;
      border: 1px solid #435a72;
      border-radius: 3px;
      background: #071324;
    }

    .mode {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 36px;
      padding: 0 13px;
      color: #dce6ef;
      border: 0;
      border-radius: 1px;
      background: transparent;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .02em;
      text-decoration: none;
    }

    .mode[aria-current="page"] {
      color: var(--ink);
      background: var(--paper);
    }

    .mode--pdf {
      gap: 7px;
      color: #ebf9f7;
      background: #0a5f5b;
    }

    .mode--pdf:hover { background: var(--teal); }

    .progressbar {
      position: fixed;
      inset: 68px 0 auto;
      z-index: 99;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 18px;
      height: 48px;
      padding: 0 clamp(14px, 2.3vw, 34px);
      border-bottom: 1px solid rgba(213, 224, 234, .11);
      background: rgba(3, 11, 24, .94);
    }

    .progressbar__main {
      display: flex;
      align-items: center;
      gap: 13px;
      min-width: 0;
    }

    .progressbar__track {
      position: relative;
      flex: 1 1 auto;
      height: 3px;
      overflow: hidden;
      background: #2a3a4d;
    }

    .progressbar__fill {
      position: absolute;
      inset: 0 auto 0 0;
      width: var(--progress);
      background: var(--teal);
      transition: width .55s cubic-bezier(.22, 1, .36, 1);
    }

    .section-name {
      flex: none;
      color: #b9c9d8;
      font-size: 10px;
      font-weight: 850;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .progress-count {
      color: #f1f5f7;
      font-size: 11px;
      font-weight: 850;
      letter-spacing: .08em;
      white-space: nowrap;
    }

    .scrolly { position: relative; }

    .visual-shell {
      position: sticky;
      top: 0;
      z-index: 1;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 34px;
      align-items: center;
      gap: clamp(13px, 2vw, 30px);
      width: min(1320px, 100%);
      height: 100svh;
      margin: 0 auto;
      padding: 132px clamp(15px, 3vw, 46px) 50px;
      overflow: hidden;
    }

    .deck {
      position: relative;
      display: grid;
      width: 100%;
      height: 100%;
      place-items: center;
      perspective: 1800px;
    }

    .safety-card {
      --card-width: 900px;
      --card-height: 610px;
      position: absolute;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      width: min(var(--card-width), 100%);
      height: min(var(--card-height), 100%);
      overflow: hidden;
      padding: clamp(10px, 1.25vw, 18px);
      color: var(--ink);
      border: clamp(2px, .2vw, 3px) solid var(--ink);
      border-radius: 3px;
      background: var(--paper);
      box-shadow: 0 30px 80px rgba(0, 0, 0, .44);
      opacity: 0;
      filter: brightness(.14) saturate(.28);
      transform: translate3d(0, 8%, -80px) scale(.95);
      transform-origin: 50% 56%;
      transition:
        opacity .46s ease,
        filter .52s ease,
        transform .68s cubic-bezier(.22, 1, .36, 1);
      pointer-events: none;
      will-change: transform, opacity, filter;
    }

    .safety-card.shape-anchor {
      --card-width: 1040px;
      --card-height: 680px;
    }

    .safety-card.shape-square {
      --card-width: 680px;
      --card-height: 680px;
    }

    .safety-card.shape-contact {
      --card-width: 1020px;
      --card-height: 410px;
      grid-template-rows: auto minmax(0, 1fr) auto;
    }

    .safety-card.is-active {
      z-index: 20;
      opacity: 1;
      filter: none;
      transform: translate3d(0, 0, 0) scale(1);
      pointer-events: auto;
    }

    .safety-card.is-next {
      z-index: calc(10 - var(--depth));
      opacity: calc(.17 - (var(--depth) * .035));
      filter: brightness(.14) saturate(.22);
      transform: translate3d(0, calc(13px * var(--depth)), calc(-70px * var(--depth))) scale(calc(1 - (.018 * var(--depth))));
    }

    .safety-card.is-past {
      z-index: 1;
      opacity: 0;
      transform: translate3d(0, -7%, 0) scale(.965);
    }

    .card-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 36px;
      padding-bottom: 8px;
    }

    .card-number {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      aspect-ratio: 1;
      flex: none;
      color: var(--paper);
      border-radius: 50%;
      background: var(--ink);
      font-size: 14px;
      font-weight: 900;
    }

    .card-chip {
      min-width: 0;
      overflow: hidden;
      color: var(--ink-soft);
      font-size: clamp(9px, .8vw, 12px);
      font-weight: 900;
      letter-spacing: .1em;
      text-overflow: ellipsis;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .card-art {
      min-height: 0;
      overflow: hidden;
      border-block: 1px solid var(--paper-edge);
      background: #fffefb;
    }

    .card-art img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      transform: scale(1.018);
      transition: transform .95s cubic-bezier(.22, 1, .36, 1);
    }

    .safety-card.is-active .card-art img { transform: scale(1); }

    .card-copy {
      padding-top: clamp(8px, 1vw, 14px);
    }

    .card-copy h2 {
      margin: 0;
      color: var(--ink);
      font-family: "Avenir Next Condensed", "Arial Narrow", sans-serif;
      font-size: clamp(19px, 2.05vw, 34px);
      font-weight: 900;
      line-height: .98;
      letter-spacing: -.025em;
      text-transform: uppercase;
    }

    .card-copy p {
      max-width: 74ch;
      margin: 7px 0 0;
      color: var(--ink-soft);
      font-size: clamp(12px, .95vw, 15px);
      font-weight: 650;
      line-height: 1.3;
    }

    .review-line {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-top: 9px;
      color: #4a6279;
      font-size: 9px;
      font-weight: 850;
      letter-spacing: .085em;
      text-transform: uppercase;
    }

    .review-line::before {
      width: 7px;
      aspect-ratio: 1;
      border-radius: 50%;
      background: var(--teal);
      content: "";
    }

    .review-line.is-uncertain::before { background: #bd7424; }

    .safety-card.is-warning { border-color: var(--warning); }
    .safety-card.is-programming { background: #eef5f1; }

    .contact-routes {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: clamp(10px, 1.6vw, 22px);
      align-content: center;
      min-height: 0;
      padding: clamp(10px, 2vw, 28px) 0;
      border-block: 1px solid var(--paper-edge);
    }

    .contact-route {
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-width: 0;
      padding: clamp(13px, 1.8vw, 24px);
      border: 2px solid var(--ink);
      background: #f4f7f6;
    }

    .contact-route.is-emergency {
      color: #671f1c;
      border-color: var(--warning);
      background: #fbefeb;
    }

    .route-label {
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .route-number {
      margin-top: 6px;
      color: currentColor;
      font-size: clamp(25px, 4vw, 52px);
      font-weight: 900;
      line-height: 1;
      letter-spacing: -.045em;
      text-decoration: none;
    }

    .contact-route p {
      margin: 8px 0 0;
      color: currentColor;
      font-size: clamp(11px, .9vw, 14px);
      font-weight: 700;
      line-height: 1.3;
    }

    .route-map {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      height: min(520px, 68vh);
    }

    .route-map::before {
      position: absolute;
      top: 4%;
      bottom: 4%;
      left: 50%;
      width: 1px;
      background: #31465b;
      content: "";
    }

    .route-dot {
      position: relative;
      z-index: 1;
      width: 9px;
      height: 9px;
      padding: 0;
      border: 1px solid #64798e;
      border-radius: 50%;
      background: var(--shell);
      cursor: pointer;
      transition: transform .3s ease, border-color .3s ease, background .3s ease;
    }

    .route-dot:hover { border-color: #e9f0f5; }

    .route-dot.is-active {
      border-color: var(--teal);
      background: var(--teal);
      transform: scale(1.65);
    }

    .route-dot.is-complete {
      border-color: #6faaa5;
      background: #6faaa5;
    }

    .scroll-cue {
      position: absolute;
      bottom: 18px;
      left: clamp(15px, 3vw, 46px);
      display: flex;
      align-items: center;
      gap: 10px;
      color: #c6d3df;
      font-size: 10px;
      font-weight: 850;
      letter-spacing: .11em;
      text-transform: uppercase;
      pointer-events: none;
    }

    .scroll-cue__arrow {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 25px;
      height: 30px;
      border: 1px solid #66798c;
      border-radius: 15px;
    }

    .scroll-cue__arrow::after {
      color: var(--teal-pale);
      content: "↓";
      animation: drift 1.35s cubic-bezier(.22, 1, .36, 1) infinite;
    }

    .scroll-cue.is-end .scroll-cue__arrow::after {
      content: "✓";
      animation: none;
    }

    .steps {
      position: relative;
      z-index: 2;
      margin-top: -100svh;
      pointer-events: none;
    }

    .step-sentinel {
      height: 115svh;
      scroll-margin-top: 0;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    :focus-visible {
      outline: 3px solid #7ce1d7;
      outline-offset: 4px;
    }

    @keyframes drift {
      0%, 100% { opacity: .42; transform: translateY(-3px); }
      50% { opacity: 1; transform: translateY(3px); }
    }

    @media (max-width: 820px) {
      .topbar { min-height: 64px; }
      .brand p { display: none; }
      .progressbar { top: 64px; height: 45px; }
      .progressbar__main { gap: 9px; }
      .section-name { max-width: 40vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .mode { min-height: 34px; padding-inline: 10px; font-size: 11px; }
      .pdf-long { display: none; }

      .visual-shell {
        grid-template-columns: 1fr;
        padding: 120px 11px 54px;
      }

      .route-map { display: none; }

      .safety-card {
        width: 100%;
        height: 100%;
        padding: 10px;
      }

      .safety-card.shape-contact { height: min(520px, 100%); }
      .card-meta { min-height: 31px; padding-bottom: 6px; }
      .card-number { width: 29px; font-size: 12px; }
      .card-copy h2 { font-size: clamp(18px, 5.2vw, 28px); }
      .card-copy p { font-size: clamp(11px, 3.15vw, 14px); }
      .review-line { margin-top: 6px; font-size: 8px; }
      .contact-routes { grid-template-columns: 1fr; }
      .route-number { font-size: clamp(26px, 8.4vw, 42px); }
      .scroll-cue { bottom: 16px; left: 14px; }
      .step-sentinel { height: 108svh; }
    }

    @media (max-height: 700px) and (min-width: 821px) {
      .visual-shell { padding-top: 124px; padding-bottom: 42px; }
      .card-copy h2 { font-size: clamp(18px, 1.7vw, 27px); }
      .card-copy p { font-size: 12px; }
      .review-line { margin-top: 5px; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .safety-card, .card-art img, .progressbar__fill, .route-dot { transition: none; }
      .scroll-cue__arrow::after { animation: none; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>Recovery safety cards</h1>
      <p>Scroll through 14 illustrated recovery cards. Design prototype · not for patient use.</p>
    </div>
    <nav class="modes" aria-label="Choose guide format">
      <span class="mode" aria-current="page">Digital</span>
      <a class="mode mode--pdf" href="../output/pdf/airline-safety-card-deck-prototype.pdf" download><span aria-hidden="true">↓</span><span class="pdf-long">Print&nbsp;</span>PDF</a>
    </nav>
  </header>

  <div class="progressbar" aria-label="Guide progress">
    <div class="progressbar__main">
      <span class="section-name" id="sectionName">Care for the surgery site</span>
      <span class="progressbar__track" aria-hidden="true"><span class="progressbar__fill"></span></span>
    </div>
    <span class="progress-count" id="progressCount" aria-live="polite">Card 01 of 14</span>
  </div>

  <main class="scrolly">
    <section class="visual-shell" aria-label="Scroll through the recovery cards">
      <div class="deck" id="deck"></div>
      <nav class="route-map" id="routeMap" aria-label="Jump to a card"></nav>
      <div class="scroll-cue" id="scrollCue" aria-hidden="true">
        <span class="scroll-cue__arrow"></span>
        <span id="scrollCueText">Scroll for card 02</span>
      </div>
    </section>
    <div class="steps" id="steps" aria-hidden="true"></div>
  </main>

  <script>
    const cards = [
      {
        number: 1, section: "Care for the surgery site", chip: "Day 2", shape: "anchor",
        title: "Remove the head dressing. Then check behind the ear.",
        body: "Two days after surgery, take off the mastoid dressing and look for tape covering the incision.",
        image: "assets/generated/card-01-dressing-check.png",
        alt: "Two-beat illustration: removing the mastoid dressing, then checking behind the ear for tape over the incision."
      },
      {
        number: 2, section: "Care for the surgery site", chip: "Tape present · keep dry",
        title: "If there is tape", body: "Keep the area dry until three days after surgery. Do not clean it before then.",
        image: "assets/generated/card-02-tape-keep-dry.png",
        alt: "Tape directly over the incision behind the ear and a keep-dry symbol."
      },
      {
        number: 3, section: "Care for the surgery site", chip: "No tape · 2× a day", uncertain: true,
        title: "If there is no tape", body: "Clean the incision edges gently twice a day with the 50/50 mix, then apply antibiotic ointment.",
        image: "assets/generated/card-03-no-tape-clean.png",
        alt: "Three-beat illustration: gently clean incision edges, combine equal parts hydrogen peroxide and distilled water, then apply ointment."
      },
      {
        number: 4, section: "Care for the surgery site", chip: "Day 3",
        title: "Showering again", body: "Three days after surgery, you may shower and wash your hair.",
        image: "assets/generated/card-04-shower.png", alt: "A calm adult washes their hair under a shower."
      },
      {
        number: 5, section: "Care for the surgery site", chip: "About 2 weeks",
        title: "Your wound check", body: "Return for a wound check and ear exam. The stitches dissolve on their own.",
        image: "assets/generated/card-05-followup.png",
        alt: "A calendar leads to a clinician examining the ear, with an inset showing dissolvable stitches behind the ear."
      },
      {
        number: 6, section: "Know when to call", chip: "All 3 together", shape: "square", warning: true,
        title: "Redness with all three signs", body: "Call when all three are present: red and swollen · not improving in 1–2 days · painful to touch.",
        image: "assets/generated/card-06-redness-all-three.png",
        alt: "Three connected signs behind the ear: redness and swelling, no improvement across two days, and pain when touched."
      },
      {
        number: 7, section: "Know when to call", chip: "Above 101.5°F", warning: true,
        title: "Fever", body: "Call above this temperature.", image: "assets/generated/card-07-fever.png",
        alt: "A forehead temperature check with a thermometer and an upward threshold arrow."
      },
      {
        number: 8, section: "Know when to call", chip: "Behind the ear", warning: true,
        title: "Swelling or fluid", body: "Call if fluid feels like it is building up under the skin.",
        image: "assets/generated/card-08-swelling-fluid.png",
        alt: "A person holds hair aside to show swelling behind the ear, with an inset suggesting fluid under intact skin."
      },
      {
        number: 9, section: "Know when to call", chip: "Any of these", warning: true,
        title: "Other warning signs", body: "Call for headache, light sensitivity, or excessive lethargy.",
        image: "assets/generated/card-09-warning-signs.png",
        alt: "Three equal signs: headache, shielding the eyes from light, and excessive lethargy."
      },
      {
        number: 10, section: "Know when to call", chip: "Just call", warning: true,
        title: "Questions or concerns", body: "Call for any wound-care question or medical concern.",
        image: "assets/generated/card-10-call-concerns.png", alt: "A calm adult calls by phone with a question symbol."
      },
      {
        number: 11, section: "Know when to call", chip: "Save these", shape: "contact",
        title: "The numbers to use", contact: true
      },
      {
        number: 12, section: "Prepare for programming", chip: "After healing", programming: true,
        title: "Return for programming", body: "After the surgery site heals, return for your first programming visit.",
        image: "assets/generated/card-12-return-after-healing.png",
        alt: "A healed area behind the ear leads to an appointment calendar and clinic."
      },
      {
        number: 13, section: "Prepare for programming", chip: "The audiologist", programming: true,
        title: "Your first program", body: "The audiologist programs the speech processor for your needs.",
        image: "assets/generated/card-13-programming.png",
        alt: "An audiologist uses a computer to adjust an adult patient's external cochlear implant speech processor."
      },
      {
        number: 14, section: "Prepare for programming", chip: "Ongoing", programming: true,
        title: "Checks and fine-tuning", body: "The team checks the equipment and adjusts the program over time.",
        image: "assets/generated/card-14-ongoing-visits.png",
        alt: "Repeated appointments lead to an equipment check and an ongoing fine-tuning loop."
      }
    ];

    const deck = document.getElementById("deck");
    const stepsRoot = document.getElementById("steps");
    const routeMap = document.getElementById("routeMap");
    const sectionName = document.getElementById("sectionName");
    const progressCount = document.getElementById("progressCount");
    const scrollCue = document.getElementById("scrollCue");
    const scrollCueText = document.getElementById("scrollCueText");

    const contactMarkup = `
      <div class="contact-routes">
        <div class="contact-route">
          <span class="route-label">Routine questions</span>
          <a class="route-number" href="tel:+14153532148">415-353-2148</a>
          <p>Nursing line · callback within 12 hours · call again if no one calls back.</p>
        </div>
        <div class="contact-route is-emergency">
          <span class="route-label">Emergency</span>
          <a class="route-number" href="tel:+14154761000">415-476-1000</a>
          <p>Ask for the Otolaryngology resident on call.</p>
        </div>
      </div>`;

    cards.forEach((card, index) => {
      const article = document.createElement("article");
      article.className = [
        "safety-card",
        `shape-${card.shape || "standard"}`,
        card.warning ? "is-warning" : "",
        card.programming ? "is-programming" : ""
      ].filter(Boolean).join(" ");
      article.dataset.index = index;
      article.id = `card-${String(card.number).padStart(2, "0")}`;
      article.setAttribute("aria-hidden", "true");
      article.innerHTML = `
        <header class="card-meta">
          <span class="card-number">${card.number}</span>
          <span class="card-chip">${card.chip}</span>
        </header>
        ${card.contact ? contactMarkup : `<div class="card-art"><img loading="lazy" decoding="async" data-src="${card.image}" alt="${card.alt}"></div>`}
        <footer class="card-copy">
          <h2>${card.title}</h2>
          ${card.body ? `<p>${card.body}</p>` : ""}
          <span class="review-line${card.uncertain ? " is-uncertain" : ""}">${card.uncertain ? "Prototype · applicator technique unresolved" : "Design prototype · not for patient use"}</span>
        </footer>`;
      deck.appendChild(article);

      const step = document.createElement("div");
      step.className = "step-sentinel";
      step.dataset.index = index;
      stepsRoot.appendChild(step);

      const dot = document.createElement("button");
      dot.className = "route-dot";
      dot.type = "button";
      dot.dataset.index = index;
      dot.setAttribute("aria-label", `Go to card ${card.number}: ${card.title}`);
      dot.addEventListener("click", () => {
        ensureCardImageLoaded(index);
        step.scrollIntoView({ behavior: "smooth", block: "start" });
      });
      routeMap.appendChild(dot);
    });

    const cardEls = [...deck.children];
    const steps = [...stepsRoot.children];
    const dots = [...routeMap.children];
    let activeIndex = -1;

    function ensureCardImageLoaded(index) {
      const image = cardEls[index]?.querySelector("img[data-src]");
      if (!image) return;
      image.src = image.dataset.src;
      image.removeAttribute("data-src");
    }

    function activate(index) {
      if (index === activeIndex || index < 0 || index >= cards.length) return;
      activeIndex = index;
      [index - 1, index, index + 1, index + 2].forEach(ensureCardImageLoaded);

      cardEls.forEach((element, cardIndex) => {
        const difference = cardIndex - index;
        element.classList.toggle("is-active", difference === 0);
        element.classList.toggle("is-past", difference < 0);
        element.classList.toggle("is-next", difference > 0 && difference <= 2);
        element.style.setProperty("--depth", String(Math.min(Math.max(difference, 1), 2)));
        element.setAttribute("aria-hidden", String(difference !== 0));
      });

      dots.forEach((dot, dotIndex) => {
        dot.classList.toggle("is-active", dotIndex === index);
        dot.classList.toggle("is-complete", dotIndex < index);
        dot.setAttribute("aria-current", dotIndex === index ? "step" : "false");
      });

      const card = cards[index];
      document.documentElement.style.setProperty("--progress", `${((index + 1) / cards.length) * 100}%`);
      sectionName.textContent = card.section;
      progressCount.textContent = `Card ${String(index + 1).padStart(2, "0")} of ${cards.length}`;

      const atEnd = index === cards.length - 1;
      scrollCue.classList.toggle("is-end", atEnd);
      scrollCueText.textContent = atEnd ? "End of guide · PDF remains above" : `Scroll for card ${String(index + 2).padStart(2, "0")}`;
      history.replaceState(null, "", `#${cardEls[index].id}`);
    }

    let scrollSyncFrame = 0;

    function syncActiveToScroll() {
      scrollSyncFrame = 0;
      const viewportMidpoint = window.innerHeight / 2;
      const midpointIndex = steps.findIndex((step) => {
        const bounds = step.getBoundingClientRect();
        return bounds.top <= viewportMidpoint && bounds.bottom > viewportMidpoint;
      });

      if (midpointIndex >= 0) activate(midpointIndex);
    }

    function scheduleScrollSync() {
      if (scrollSyncFrame) return;
      scrollSyncFrame = requestAnimationFrame(syncActiveToScroll);
    }

    const observer = new IntersectionObserver(scheduleScrollSync, {
      rootMargin: "-43% 0px -43% 0px",
      threshold: [0, .01, .2]
    });

    steps.forEach((step) => observer.observe(step));
    addEventListener("scroll", scheduleScrollSync, { passive: true });
    addEventListener("resize", scheduleScrollSync);

    document.addEventListener("keydown", (event) => {
      if (event.metaKey || event.ctrlKey || event.altKey) return;
      const target = event.target;
      if (target instanceof HTMLAnchorElement || target instanceof HTMLButtonElement) return;

      let next = null;
      if (["ArrowDown", "PageDown"].includes(event.key)) next = Math.min(cards.length - 1, activeIndex + 1);
      if (["ArrowUp", "PageUp"].includes(event.key)) next = Math.max(0, activeIndex - 1);
      if (event.key === "Home") next = 0;
      if (event.key === "End") next = cards.length - 1;
      if (next === null || next === activeIndex) return;
      event.preventDefault();
      ensureCardImageLoaded(next);
      steps[next].scrollIntoView({ behavior: "smooth", block: "start" });
    });

    const hashIndex = cards.findIndex((card) => `#card-${String(card.number).padStart(2, "0")}` === location.hash);
    activate(hashIndex >= 0 ? hashIndex : 0);
    if (hashIndex >= 0) requestAnimationFrame(() => steps[hashIndex].scrollIntoView({ block: "start" }));
  </script>
</body>
</html>
