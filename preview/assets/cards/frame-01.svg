<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <!-- Frame 01 · Day 2: take the bandage off, then check behind the ear · safety-card grammar -->
  <defs>
    <!-- consistent guide figure: adult head, left-facing profile, with ear -->
    <g id="head">
      <path d="M 6 -88
               C -40 -86 -70 -60 -75 -24
               C -76 -14 -74 -8 -77 0
               L -87 12
               C -89 16 -86 20 -80 21
               C -83 28 -83 34 -78 38
               C -81 44 -79 52 -71 56
               C -63 70 -48 79 -32 81
               C -21 83 -11 83 -2 81
               L 2 106 L 58 106 L 52 64
               C 72 46 83 20 81 -12
               C 77 -58 48 -88 6 -88 Z"
        fill="#ddecf0" stroke="#052049" stroke-width="7" stroke-linejoin="round"/>
      <path d="M -10 106 C 18 94 76 96 108 110 L 114 138 L -14 138 Z" fill="#ddecf0" stroke="#052049" stroke-width="7" stroke-linejoin="round"/>
      <path d="M 8 -4 C 28 -14 44 2 34 22 C 27 35 11 38 3 29 C 7 24 9 18 8 12"
        fill="#fbfaf5" stroke="#052049" stroke-width="5.5" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="M 15 4 C 23 2 27 10 21 16" fill="none" stroke="#052049" stroke-width="4" stroke-linecap="round"/>
      <path d="M 6 -88 C -30 -87 -58 -68 -70 -38 C -52 -60 -22 -70 4 -68 C 40 -66 66 -44 74 -12 C 80 -20 81 -32 79 -44 C 70 -74 44 -89 6 -88 Z" fill="#052049"/>
    </g>
    <!-- mastoid dressing band over the ear -->
    <g id="band">
      <rect x="-14" y="-98" width="50" height="186" rx="24" transform="rotate(6)" fill="#ffffff" stroke="#052049" stroke-width="6.5"/>
      <line x1="-2" y1="-66" x2="18" y2="-66" transform="rotate(6)" stroke="#052049" stroke-width="4"/>
      <line x1="-4" y1="58" x2="17" y2="58" transform="rotate(6)" stroke="#052049" stroke-width="4"/>
      <rect x="-3" y="-97" width="28" height="17" transform="rotate(6)" fill="#ffffff" stroke="#052049" stroke-width="4"/>
    </g>
    <!-- tape strip -->
    <g id="tape">
      <path d="M-28 -11 L24 -11 L30 -5 L24 11 L-24 11 L-30 4 Z" fill="#ffffff" stroke="#052049" stroke-width="5" stroke-linejoin="round"/>
      <line x1="-11" y1="-11" x2="-11" y2="11" stroke="#052049" stroke-width="3.5"/>
      <line x1="4" y1="-11" x2="4" y2="11" stroke="#052049" stroke-width="3.5"/>
    </g>
  </defs>

  <rect x="0" y="0" width="800" height="600" fill="#fbfaf5"/>
  <rect x="3" y="3" width="794" height="594" fill="none" stroke="#052049" stroke-width="6"/>

  <!-- furniture -->
  <rect x="26" y="26" width="56" height="56" fill="#feb80a" stroke="#052049" stroke-width="4"/>
  <text x="54" y="63" text-anchor="middle" font-size="26" font-weight="800" fill="#052049">01</text>
  <rect x="552" y="30" width="218" height="44" fill="#ffffff" stroke="#052049" stroke-width="4"/>
  <text x="661" y="58" text-anchor="middle" font-size="16" font-weight="800" letter-spacing="1.2" fill="#052049">DAY 2 AFTER SURGERY</text>
  <rect x="188" y="34" width="300" height="28" fill="#fbfaf5" stroke="#052049" stroke-width="2"/>
  <text x="338" y="53" text-anchor="middle" font-size="10" font-weight="800" letter-spacing="0.4" fill="#052049">DRAFT ARTWORK · PENDING CLINICAL REVIEW</text>

  <!-- beat 1 · bandage on -> head free -->
  <g transform="translate(250,180) scale(0.72)">
    <use href="#head"/>
    <use href="#band"/>
  </g>

  <g fill="#14828c" transform="translate(352,172)">
    <rect x="0" y="-6" width="64" height="12"/>
    <path d="M64 -17 L100 0 L64 17 Z"/>
  </g>

  <g transform="translate(568,180) scale(0.72)">
    <use href="#head"/>
  </g>

  <text x="400" y="308" text-anchor="middle" font-size="20" font-weight="800" letter-spacing="1.6" fill="#29405d">REMOVE THE HEAD DRESSING</text>

  <!-- divider -->
  <rect x="60" y="342" width="680" height="4" fill="#ddecf0"/>

  <!-- beat 2 · check behind the ear, anchored detail inset -->
  <g transform="translate(246,384) scale(0.54)">
    <use href="#head"/>
    <use href="#tape" transform="translate(66,26) rotate(-72) scale(0.62)"/>
  </g>

  <!-- leader line anchoring the magnified inset to the taped spot -->
  <line x1="282" y1="398" x2="448" y2="410" stroke="#052049" stroke-width="4"/>
  <circle cx="282" cy="398" r="7" fill="#052049"/>

  <g transform="translate(518,408)">
    <circle r="70" fill="#ffffff" stroke="#052049" stroke-width="6"/>
    <g transform="translate(-40,-12) scale(1.5)">
      <path d="M 8 -4 C 28 -14 44 2 34 22 C 27 35 11 38 3 29 C 7 24 9 18 8 12"
        fill="#ddecf0" stroke="#052049" stroke-width="5.5" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="M 15 4 C 23 2 27 10 21 16" fill="none" stroke="#052049" stroke-width="4" stroke-linecap="round"/>
    </g>
    <use href="#tape" transform="translate(18,16) rotate(-72) scale(0.92)"/>
    <circle cx="18" cy="16" r="30" fill="none" stroke="#feb80a" stroke-width="5"/>
  </g>
  <rect x="578" y="346" width="150" height="34" fill="#052049"/>
  <text x="653" y="369" text-anchor="middle" font-size="14" font-weight="800" letter-spacing="1.2" fill="#ffffff">SURGICAL TAPE</text>

  <text x="400" y="498" text-anchor="middle" font-size="20" font-weight="800" letter-spacing="1.3" fill="#29405d">CHECK: IS THERE SURGICAL TAPE?</text>
  <path d="M400 506 L400 516 M400 516 L227 526 M400 516 L573 526" fill="none" stroke="#14828c" stroke-width="5" stroke-linecap="round"/>
  <rect x="68" y="526" width="318" height="54" fill="#eaf4f8" stroke="#052049" stroke-width="4"/>
  <text x="227" y="550" text-anchor="middle" font-size="18" font-weight="800" letter-spacing="1" fill="#052049">TAPE · CARD 02</text>
  <text x="227" y="571" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="1.2" fill="#29405d">KEEP DRY</text>
  <rect x="414" y="526" width="318" height="54" fill="#fff5cf" stroke="#052049" stroke-width="4"/>
  <text x="573" y="550" text-anchor="middle" font-size="18" font-weight="800" letter-spacing="1" fill="#052049">NO TAPE · CARD 03</text>
  <text x="573" y="571" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="1.2" fill="#29405d">CLEAN</text>
</svg>
