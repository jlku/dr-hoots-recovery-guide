<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TikTok-style Dr. Hoots video</title>
  <style>
    :root {
      --ink: #052049;
      --link: #006ba6;
      --accent: #14828c;
      --muted: #506380;
      --paper: #fbfcfa;
      --wash: #eef4f3;
      --yellow: #f6df46;
      --content: min(1020px, calc(100vw - 40px));
      --sans: "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    a { color: var(--link); text-underline-offset: 4px; }
    a:hover { text-decoration-thickness: 2px; }
    a:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 5px; }

    .wrap { width: var(--content); margin-inline: auto; }

    .site-header {
      padding: 22px 0;
      border-bottom: 5px solid var(--accent);
      background: #f7faf8;
    }

    .site-header a { color: var(--ink); font-size: 15px; font-weight: 700; }

    main { padding: 24px 0 34px; }

    .player {
      width: min(100%, 430px);
      margin-inline: auto;
    }

    h1 {
      margin: 0;
      font-size: clamp(25px, 5vw, 38px);
      line-height: 1.05;
      letter-spacing: -.03em;
    }

    .lede {
      margin: 8px 0 20px;
      color: var(--muted);
      font-size: 15px;
    }

    .phone {
      overflow: hidden;
      border: 1px solid #b8c2ca;
      background: #071b36;
      box-shadow: 0 28px 72px rgba(5, 32, 73, .2);
    }

    video {
      width: 100%;
      aspect-ratio: 9 / 16;
      display: block;
      background: #071b36;
    }

    .chapters {
      display: grid;
      gap: 8px;
      margin: 0 0 16px;
    }

    .chapter {
      display: grid;
      grid-template-columns: 52px minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
      width: 100%;
      min-height: 48px;
      padding: 8px 11px;
      color: var(--ink);
      border: 1px solid #b8c8cf;
      background: #fff;
      font: inherit;
      text-align: left;
      cursor: pointer;
    }

    .chapter:hover { border-color: var(--accent); }

    .chapter[aria-pressed="true"] {
      color: #fff;
      border-color: var(--ink);
      background: var(--ink);
    }

    .chapter-part {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .chapter-title { font-size: 14px; font-weight: 750; }
    .chapter-time { color: currentColor; font-size: 12px; font-variant-numeric: tabular-nums; }

    .actions {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      margin-top: 18px;
      font-size: 14px;
    }

    .actions span { color: var(--muted); }

    footer {
      padding: 26px 0;
      background: var(--wash);
      color: var(--muted);
      font-size: 14px;
    }

    @media (max-width: 760px) {
      :root { --content: min(100% - 32px, 1020px); }
    }
  </style>
</head>
<body>
  <header class="site-header"><div class="wrap"><a href="index.html#variations">← All experiments</a></div></header>
  <main class="wrap">
    <div class="player">
      <h1>TikTok-style Dr. Hoots guide</h1>
      <p class="lede">The complete recovery guide in three short-form sections · 2:03 total.</p>
      <nav class="chapters" aria-label="Video chapters">
        <button class="chapter" type="button" data-start="0" aria-pressed="true"><span class="chapter-part">Part 1</span><span class="chapter-title">Care for the surgery site</span><span class="chapter-time">0:00</span></button>
        <button class="chapter" type="button" data-start="42.4" aria-pressed="false"><span class="chapter-part">Part 2</span><span class="chapter-title">When to call</span><span class="chapter-time">0:42</span></button>
        <button class="chapter" type="button" data-start="95.12" aria-pressed="false"><span class="chapter-part">Part 3</span><span class="chapter-title">First programming visits</span><span class="chapter-time">1:35</span></button>
      </nav>
      <div class="phone"><video controls playsinline preload="metadata" poster="assets/video/dr-hoots-full-guide-native-paced-poster.png"><source src="assets/video/dr-hoots-full-guide-native-paced.mp4" type="video/mp4">Your browser does not support the video element.</video></div>
      <div class="actions"><a href="assets/video/dr-hoots-full-guide-native-paced.mp4" download>Download complete MP4</a><span>Not patient-ready</span></div>
    </div>
  </main>
  <footer><div class="wrap">Private working concept · not an official UCSF website.</div></footer>
  <script>
    const video = document.querySelector("video");
    const chapters = [...document.querySelectorAll(".chapter")];

    function markCurrentChapter(index) {
      chapters.forEach((chapter, chapterIndex) => {
        chapter.setAttribute("aria-pressed", String(chapterIndex === index));
      });
    }

    chapters.forEach((chapter, index) => {
      chapter.addEventListener("click", () => {
        const start = Number(chapter.dataset.start);
        video.currentTime = start;
        markCurrentChapter(index);
        video.play().catch(() => {});
      });
    });

    video.addEventListener("timeupdate", () => {
      const currentIndex = chapters.findLastIndex((chapter) => video.currentTime >= Number(chapter.dataset.start));
      markCurrentChapter(Math.max(0, currentIndex));
    });
  </script>
</body>
</html>
