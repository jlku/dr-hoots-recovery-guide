<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TikTok-style Dr. Hoots video</title>
  <style>
    :root {
      --ink: #052049;
      --link: #006ba6;
      --accent: #14828c;
      --muted: #506380;
      --paper: #fbfcfa;
      --wash: #eef4f3;
      --yellow: #f6df46;
      --content: min(1020px, calc(100vw - 40px));
      --sans: "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    a { color: var(--link); text-underline-offset: 4px; }
    a:hover { text-decoration-thickness: 2px; }
    a:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 5px; }

    .wrap { width: var(--content); margin-inline: auto; }

    .site-header {
      padding: 22px 0;
      border-bottom: 5px solid var(--accent);
      background: #f7faf8;
    }

    .site-header a { color: var(--ink); font-size: 15px; font-weight: 700; }

    main { padding: 24px 0 34px; }

    .player {
      display: grid;
      grid-template-columns: minmax(0, 430px) minmax(280px, 360px);
      grid-template-areas: "video info";
      align-items: start;
      gap: clamp(28px, 5vw, 64px);
      width: min(100%, 854px);
      margin-inline: auto;
    }

    .player-info { grid-area: info; padding-top: 6px; }

    .video-column {
      grid-area: video;
      width: min(100%, 430px, calc((100svh - 132px) * 9 / 16));
      margin-inline: auto;
    }

    h1 {
      margin: 0;
      font-size: clamp(25px, 5vw, 38px);
      line-height: 1.05;
      letter-spacing: -.03em;
    }

    .lede {
      margin: 8px 0 20px;
      color: var(--muted);
      font-size: 15px;
    }

    .lede-short { display: none; }

    .phone {
      overflow: hidden;
      border: 1px solid #b8c2ca;
      background: #071b36;
      box-shadow: 0 28px 72px rgba(5, 32, 73, .2);
    }

    video {
      width: 100%;
      aspect-ratio: 9 / 16;
      display: block;
      background: #071b36;
    }

    .chapters {
      display: grid;
      gap: 8px;
      margin: 0 0 16px;
    }

    .chapter {
      display: grid;
      grid-template-columns: 52px minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
      width: 100%;
      min-height: 48px;
      padding: 8px 11px;
      color: var(--ink);
      border: 1px solid #b8c8cf;
      background: #fff;
      font: inherit;
      text-align: left;
      cursor: pointer;
    }

    .chapter:hover { border-color: var(--accent); }

    .chapter[aria-pressed="true"] {
      color: #fff;
      border-color: var(--ink);
      background: var(--ink);
    }

    .chapter-part {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .chapter-title { font-size: 14px; font-weight: 750; }
    .chapter-time { color: currentColor; font-size: 12px; font-variant-numeric: tabular-nums; }

    .actions {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      margin-top: 18px;
      font-size: 14px;
    }

    .actions span { color: var(--muted); }

    @media (max-width: 760px) {
      :root { --content: min(100% - 32px, 1020px); }

      .site-header { padding: 10px 0; border-bottom-width: 4px; }
      .site-header a { font-size: 14px; }
      main { padding: 10px 0 24px; }

      .player {
        grid-template-columns: 1fr;
        grid-template-areas: "info" "video";
        gap: 8px;
        width: 100%;
      }

      .player-info { padding-top: 0; }
      h1 { font-size: 25px; }
      .lede { margin: 3px 0 8px; font-size: 13px; }
      .lede-long { display: none; }
      .lede-short { display: inline; }

      .chapters {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 6px;
        margin-bottom: 0;
      }

      .chapter {
        grid-template-columns: 1fr;
        justify-items: center;
        gap: 0;
        min-height: 42px;
        padding: 4px 2px;
        text-align: center;
      }

      .chapter-part { font-size: 10px; }
      .chapter-title { display: none; }
      .chapter-time { font-size: 10px; }

      .video-column {
        width: min(100%, calc((100svh - 176px) * 9 / 16));
      }

      .actions { margin-top: 8px; font-size: 12px; }
    }
  </style>
</head>
<body>
  <header class="site-header"><div class="wrap"><a href="index.html#variations">← All experiments</a></div></header>
  <main class="wrap">
    <div class="player">
      <div class="player-info">
        <h1>TikTok-style Dr. Hoots guide</h1>
        <p class="lede"><span class="lede-long">The complete recovery guide in three short-form sections · </span><span class="lede-short">Three parts · </span>2:03 total.</p>
        <nav class="chapters" aria-label="Video chapters">
          <button class="chapter" type="button" data-start="0" aria-pressed="true" aria-label="Part 1: Care for the surgery site, starts at 0 minutes"><span class="chapter-part">Part 1</span><span class="chapter-title">Care for the surgery site</span><span class="chapter-time">0:00</span></button>
          <button class="chapter" type="button" data-start="42.4" aria-pressed="false" aria-label="Part 2: When to call, starts at 42 seconds"><span class="chapter-part">Part 2</span><span class="chapter-title">When to call</span><span class="chapter-time">0:42</span></button>
          <button class="chapter" type="button" data-start="95.12" aria-pressed="false" aria-label="Part 3: First programming visits, starts at 1 minute 35 seconds"><span class="chapter-part">Part 3</span><span class="chapter-title">First programming visits</span><span class="chapter-time">1:35</span></button>
        </nav>
      </div>
      <div class="video-column">
        <div class="phone"><video controls playsinline preload="metadata" poster="assets/video/dr-hoots-full-guide-native-paced-poster.png"><source src="assets/video/dr-hoots-full-guide-native-paced.mp4" type="video/mp4">Your browser does not support the video element.</video></div>
        <div class="actions"><a href="assets/video/dr-hoots-full-guide-native-paced.mp4" download>Download complete MP4</a><span>Not patient-ready</span></div>
      </div>
    </div>
  </main>
  <script>
    const video = document.querySelector("video");
    const chapters = [...document.querySelectorAll(".chapter")];

    function markCurrentChapter(index) {
      chapters.forEach((chapter, chapterIndex) => {
        chapter.setAttribute("aria-pressed", String(chapterIndex === index));
      });
    }

    chapters.forEach((chapter, index) => {
      chapter.addEventListener("click", () => {
        const start = Number(chapter.dataset.start);
        video.currentTime = start;
        markCurrentChapter(index);
        video.play().catch(() => {});
      });
    });

    video.addEventListener("timeupdate", () => {
      const currentIndex = chapters.findLastIndex((chapter) => video.currentTime >= Number(chapter.dataset.start));
      markCurrentChapter(Math.max(0, currentIndex));
    });
  </script>
</body>
</html>
