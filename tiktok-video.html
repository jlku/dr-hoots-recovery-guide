<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TikTok-style Dr. Hoots video</title>
  <style>
    :root {
      --ink: #052049;
      --link: #006ba6;
      --accent: #14828c;
      --muted: #506380;
      --paper: #fbfcfa;
      --wash: #eef4f3;
      --yellow: #f6df46;
      --content: min(1020px, calc(100vw - 40px));
      --sans: "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    a { color: var(--link); text-underline-offset: 4px; }
    a:hover { text-decoration-thickness: 2px; }
    a:focus-visible { outline: 3px solid var(--accent); outline-offset: 5px; }

    .wrap { width: var(--content); margin-inline: auto; }

    .site-header {
      padding: 22px 0;
      border-bottom: 5px solid var(--accent);
      background: #f7faf8;
    }

    .site-header a { color: var(--ink); font-size: 15px; font-weight: 700; }

    main { padding: 24px 0 34px; }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .player {
      width: min(100%, 430px, calc((100svh - 170px) * 9 / 16));
      margin-inline: auto;
    }

    .phone {
      overflow: hidden;
      border: 1px solid #b8c2ca;
      background: #071b36;
      box-shadow: 0 28px 72px rgba(5, 32, 73, .2);
    }

    video {
      width: 100%;
      aspect-ratio: 9 / 16;
      display: block;
      background: #071b36;
    }

    .actions {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      margin-top: 18px;
      font-size: 14px;
    }

    .actions span { color: var(--muted); }

    footer {
      padding: 26px 0;
      background: var(--wash);
      color: var(--muted);
      font-size: 14px;
    }

    @media (max-width: 760px) {
      :root { --content: min(100% - 32px, 1020px); }
    }
  </style>
</head>
<body>
  <header class="site-header"><div class="wrap"><a href="index.html#variations">← All experiments</a></div></header>
  <main class="wrap">
    <h1 class="visually-hidden">TikTok-style Dr. Hoots video</h1>
    <div class="player">
      <div class="phone"><video controls playsinline preload="metadata" poster="assets/video/dr-hoots-tiktok-native-poster.png"><source src="assets/video/dr-hoots-tiktok-native.mp4" type="video/mp4">Your browser does not support the video element.</video></div>
      <div class="actions"><a href="assets/video/dr-hoots-tiktok-native.mp4" download>Download MP4</a><span>Not patient-ready</span></div>
    </div>
  </main>
  <footer><div class="wrap">Private working concept · not an official UCSF website.</div></footer>
</body>
</html>
